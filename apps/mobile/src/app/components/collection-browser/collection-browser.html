@if (total() || more()) {
  @if (searchable()) {
  <label [for]="searchId()">{{ searchLabel() }}</label>
  <input [id]="searchId()" type="search" enterkeyhint="search" maxlength="120" [ngModel]="browser().query()" (ngModelChange)="browser().search($event)" />
  <ng-content />
  }
  @if (count() > browser().size || more()) {
  <nav class="pages app-pagination" aria-label="Collection pages">
    <button type="button" aria-label="Previous page" [disabled]="pending() || browser().current(count()) === 1" (click)="browser().page.set(browser().current(count()) - 1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <span role="status">{{ browser().current(count()) }} <span class="page-total">{{more() ? '· More available' : '/ '+browser().pages(count())}}</span></span>
    <button type="button" aria-label="Next page" [disabled]="pending() || (!more() && browser().current(count()) === browser().pages(count()))" (click)="next()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
  </nav>
  }
  @if (searchable() && !count()) { <div class="collection-empty"><span class="collection-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 13h5l2 3h2l2-3h5"/></svg></span><h3>Try another search</h3><p>No matching items. Try another search or filter.</p></div> }
}
